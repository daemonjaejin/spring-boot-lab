apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: ticketing-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
        - name: MYSQL_DATABASE
          value: test
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: ticketing-system
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
