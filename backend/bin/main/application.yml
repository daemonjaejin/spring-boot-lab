logging:
  level:
    com.example.demo.controller.AiChatController: INFO
    org.springframework.ai: INFO

spring:
  profiles:
    active: local
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3
          temperature: 0.7

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
  packages-to-scan: com.example.demo.controller
