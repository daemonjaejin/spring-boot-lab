version: '3.8'

services:
  db:
    # 🚩 집에서 쓰는 버전이 5.7이라면 mysql:5.7
    # 8.0 중에서도 특정 버전이라면 mysql:8.0.33 처럼 명시
    image: mysql:5.7 
    container_name: spring-lab-db
    restart: always
    ports:
      - "13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: admin1234
      MYSQL_DATABASE: test
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d

  # Redis 설정
  redis:
    image: redis:alpine
    container_name: spring-lab-redis
    restart: always
    ports:
      - "6379:6379"